name: Daily Rosetta Generator

on:
  schedule:
    # Runs at 00:00 UTC every day
    - cron: '0 0 * * *'
  # Allows manual triggering from the Actions tab
  workflow_dispatch: 

# Grant the default GITHUB_TOKEN permission to push commits to the repo
permissions:
  contents: write

jobs:
  run-generator:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build and Run
      # Executes your Main method and generates the files
      run: dotnet run --configuration Release

    - name: Commit and Push results
      # Configures the bot, moves files to a data folder, checks for changes, and pushes
      run: |
        git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        # Create a top-level data directory in the repository
        mkdir -p data
        
        # Copy the generated text files from the .NET build output to the repo's data directory
        cp bin/Release/net10.0/rosetta*.txt data/
        
        # Stage only the text files located in the repo's data directory
        git add data/rosetta*.txt
        
        # Check if there are any actual changes before committing to prevent errors
        if ! git diff --staged --quiet; then
          git commit -m "Automated update of Rosetta files"
          git push
        else
          echo "No changes to commit."
        fi